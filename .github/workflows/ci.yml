name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra ray
      - run: uv run ruff check src tests
      - run: uv run pytest
      - run: make demo
  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg CODE_VERSION=${GITHUB_SHA::7} -t pairlab:ci .
      - run: docker run --rm pairlab:ci --help
