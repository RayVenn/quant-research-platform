[project]
name = "quantlab"
version = "0.1.0"
description = "Research-to-production backtesting platform: strategy plugins, free market data, vectorized engine, distributed sweeps, validation and a strategy registry"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "statsmodels>=0.14",
    "scipy>=1.10",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "fsspec>=2026.9.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
ray = ["ray[default]>=2.9"]
s3 = ["s3fs>=2024.2"]

[project.scripts]
quantlab = "quantlab.cli:main"

[dependency-groups]
dev = [
    # Ray in dev too: Ray re-launches workers via `uv run`, which only installs default groups.
    "ray[default]>=2.9",
    "pytest>=7.4",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short --strict-markers"
markers = [
    "ray: requires the optional ray extra",
    "network: needs internet (set QUANTLAB_NETWORK_TESTS=1)",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Built-ins are registered like any third-party plugin would be.
[project.entry-points."quantlab.strategies"]
pairs = "quantlab.strategies.pairs:PairsStrategy"
momentum = "quantlab.strategies.momentum:CrossSectionalMomentum"
ma_crossover = "quantlab.strategies.trend:MovingAverageCrossover"

[project.entry-points."quantlab.data_providers"]
yahoo = "quantlab.data.providers.yahoo:YahooProvider"
csv = "quantlab.data.providers.csv:CSVProvider"
